<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Binatna Shop - الإدارة</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #111827, #374151);
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
    }

    .login-logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #111827;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 17px;
      font-size: 14px;
      font-weight: 700;
    }

    .btn-primary {
      background: #111827;
      color: white;
    }

    .btn-primary:hover {
      background: #000;
    }

    .btn-success {
      background: #15803d;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-warning {
      background: #d97706;
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .full {
      width: 100%;
    }

    /* APP */

    #app {
      display: none;
      min-height: 100vh;
    }

    .topbar {
      background: #111827;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .container {
      max-width: 1250px;
      margin: auto;
      padding: 20px;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .stat-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
    }

    /* SECTION */

    .section {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 21px;
      font-weight: 800;
      margin: 0;
    }

    /* PRODUCT FORM */

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .span-2 {
      grid-column: span 2;
    }

    .image-preview {
      width: 100%;
      height: 180px;
      border-radius: 12px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: 8px;
      color: #999;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    /* PRODUCTS */

    .products-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .product-card {
      border: 1px solid #eee;
      border-radius: 14px;
      overflow: hidden;
      background: white;
    }

    .product-image {
      height: 200px;
      background: #f5f5f5;
      position: relative;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-emoji {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .product-info {
      padding: 15px;
    }

    .product-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .old-price {
      color: #999;
      text-decoration: line-through;
      font-size: 14px;
      margin-right: 7px;
    }

    .product-meta {
      font-size: 13px;
      color: #666;
      line-height: 1.8;
      margin: 10px 0;
    }

    .tag {
      display: inline-block;
      background: #eef2ff;
      color: #3730a3;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-actions {
      display: flex;
      gap: 7px;
      margin-top: 12px;
    }

    .product-actions button {
      flex: 1;
    }

    /* ORDERS */

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 12px;
      text-align: right;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }

    th {
      background: #f8f8f8;
      font-weight: 800;
    }

    .status {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-pending {
      background: #fff7ed;
      color: #c2410c;
    }

    .status-confirmed {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status-shipped {
      background: #f5f3ff;
      color: #6d28d9;
    }

    .status-delivered {
      background: #f0fdf4;
      color: #15803d;
    }

    .status-cancelled {
      background: #fef2f2;
      color: #b91c1c;
    }

    /* TOAST */

    #toast {
      position: fixed;
      left: 20px;
      bottom: 20px;
      background: #111827;
      color: white;
      padding: 13px 18px;
      border-radius: 10px;
      display: none;
      z-index: 9999;
      max-width: 90%;
      box-shadow: 0 5px 20px rgba(0,0,0,.2);
    }

    #loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #777;
    }

    .hidden {
      display: none !important;
    }

    /* MOBILE */

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .products-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 12px;
      }

      .brand {
        font-size: 17px;
      }

      .container {
        padding: 12px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .stat {
        padding: 15px;
      }

      .stat-value {
        font-size: 23px;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }

      .span-2 {
        grid-column: span 1;
      }

      .products-list {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 15px;
      }

      .section-header {
        align-items: flex-start;
      }

      .form-actions {
        flex-direction: column;
      }

      .form-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="loginPage">

    <div class="login-box">

      <div class="login-logo">
        🛍️ Binatna Shop
      </div>

      <div class="login-subtitle">
        لوحة إدارة المتجر
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input
            id="loginEmail"
            type="email"
            placeholder="البريد الإلكتروني"
            required
          >
        </div>

        <div class="form-group">
          <label>كلمة المرور</label>
          <input
            id="loginPassword"
            type="password"
            placeholder="كلمة المرور"
            required
          >
        </div>

        <button
          type="submit"
          class="btn btn-primary full"
          id="loginButton"
        >
          تسجيل الدخول
        </button>

      </form>

    </div>

  </div>


  <!-- ADMIN APP -->

  <div id="app">

    <div class="topbar">

      <div class="brand">
        🛍️ Binatna Shop — الإدارة
      </div>

      <div class="top-actions">

        <button
          class="btn btn-secondary"
          onclick="loadData()"
        >
          🔄 تحديث
        </button>

        <button
          class="btn btn-danger"
          onclick="logout()"
        >
          خروج
        </button>

      </div>

    </div>


    <main class="container">


      <!-- STATS -->

      <div class="stats">

        <div class="stat">
          <div class="stat-title">عدد المنتجات</div>
          <div class="stat-value" id="statProducts">0</div>
        </div>

        <div class="stat">
          <div class="stat-title">عدد الطلبات</div>
          <div class="stat-value" id="statOrders">0</div>
        </div>

        <div class="stat">
          <div class="stat-title">عدد القطع</div>
          <div class="stat-value" id="statItems">0</div>
        </div>

        <div class="stat">
          <div class="stat-title">المداخيل</div>
          <div class="stat-value" id="statRevenue">0 دج</div>
        </div>

      </div>


      <!-- ADD PRODUCT -->

      <section class="section">

        <div class="section-header">

          <h2 class="section-title" id="formTitle">
            ➕ إضافة منتج
          </h2>

          <button
            class="btn btn-secondary hidden"
            id="cancelEditButton"
            onclick="cancelEdit()"
          >
            إلغاء التعديل
          </button>

        </div>


        <form id="productForm">

          <input
            type="hidden"
            id="productId"
          >

          <div class="product-grid">


            <div class="form-group">

              <label>
                اسم المنتج *
              </label>

              <input
                id="pName"
                type="text"
                placeholder="مثال: قميص رجالي"
                required
              >

            </div>


            <div class="form-group">

              <label>
                السعر بالدينار *
              </label>

              <input
                id="pPrice"
                type="number"
                min="0"
                placeholder="2500"
                required
              >

            </div>


            <div class="form-group">

              <label>
                السعر القديم
              </label>

              <input
                id="pOldPrice"
                type="number"
                min="0"
                placeholder="3500"
              >

            </div>


            <div class="form-group">

              <label>
                التصنيف
              </label>

              <select id="pCategory">

                <option value="ملابس">
                  ملابس
                </option>

                <option value="عطور">
                  عطور
                </option>

                <option value="إكسسوارات">
                  إكسسوارات
                </option>

                <option value="أخرى">
                  أخرى
                </option>

              </select>

            </div>


            <div class="form-group">

              <label>
                المخزون
              </label>

              <input
                id="pStock"
                type="number"
                min="0"
                value="0"
                placeholder="10"
              >

            </div>


            <div class="form-group">

              <label>
                الإيموجي
              </label>

              <input
                id="pEmoji"
                type="text"
                placeholder="👕"
              >

            </div>


            <div class="form-group span-2">

              <label>
                رابط صورة المنتج
              </label>

              <input
                id="pImage"
                type="url"
                placeholder="https://..."
              >

              <div
                class="image-preview"
                id="imagePreview"
              >
                معاينة الصورة
              </div>

            </div>


            <div class="form-group">

              <label>
                المقاسات
              </label>

              <input
                id="pSizes"
                type="text"
                placeholder="S, M, L, XL"
              >

              <small>
                اكتب المقاسات مفصولة بفاصلة
              </small>

            </div>


            <div class="form-group">

              <label>
                الألوان
              </label>

              <input
                id="pColors"
                type="text"
                placeholder="أسود, أبيض, أحمر"
              >

              <small>
                اكتب الألوان مفصولة بفاصلة
              </small>

            </div>


            <div class="form-group">

              <label>
                الوسم
              </label>

              <select id="pTag">

                <option value="">
                  لا يوجد
                </option>

                <option value="جديد">
                  جديد
                </option>

                <option value="عرض">
                  عرض
                </option>

                <option value="الأكثر طلباً">
                  الأكثر طلباً
                </option>

                <option value="مميز">
                  مميز
                </option>

              </select>

            </div>


            <div class="form-group span-2">

              <label>
                وصف المنتج
              </label>

              <textarea
                id="pDescription"
                placeholder="اكتب وصف المنتج هنا..."
              ></textarea>

            </div>


          </div>


          <div class="form-actions">

            <button
              type="submit"
              class="btn btn-success"
              id="saveProductButton"
            >
              💾 حفظ المنتج
            </button>

            <button
              type="button"
              class="btn btn-secondary"
              onclick="clearForm()"
            >
              مسح
            </button>

          </div>

        </form>

      </section>


      <!-- PRODUCTS -->

      <section class="section">

        <div class="section-header">

          <h2 class="section-title">
            🛍️ المنتجات
          </h2>

        </div>

        <div id="productsContainer">

          <div id="loading">
            جاري تحميل المنتجات...
          </div>

        </div>

      </section>


      <!-- ORDERS -->

      <section class="section">

        <div class="section-header">

          <h2 class="section-title">
            📦 الطلبات
          </h2>

        </div>

        <div
          class="table-wrapper"
          id="ordersContainer"
        >

          جاري تحميل الطلبات...

        </div>

      </section>


    </main>

  </div>


  <div id="toast"></div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  let sb = null;

  let products = [];
  let orders = [];


  function initSupabase() {

    const url =
      window.BINATNA_SUPABASE_URL;

    const key =
      window.BINATNA_SUPABASE_ANON_KEY;

    if (
      !url ||
      !key ||
      url.includes("YOUR_PROJECT") ||
      key.includes("YOUR_SUPABASE")
    ) {

      console.error(
        "Supabase configuration missing"
      );

      return false;
    }

    sb = window.supabase.createClient(
      url,
      key
    );

    return true;
  }


  /* =========================
     TOAST
  ========================= */

  function toast(message, type = "normal") {

    const el =
      document.getElementById("toast");

    el.textContent = message;

    el.style.display = "block";

    if (type === "error") {
      el.style.background = "#dc2626";
    }
    else if (type === "success") {
      el.style.background = "#15803d";
    }
    else {
      el.style.background = "#111827";
    }

    setTimeout(() => {

      el.style.display = "none";

    }, 3500);
  }


  /* =========================
     LOGIN
  ========================= */

  document
    .getElementById("loginForm")
    .addEventListener("submit", async function(e) {

      e.preventDefault();

      if (!sb) {

        toast(
          "إعدادات Supabase غير موجودة",
          "error"
        );

        return;
      }

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      const button =
        document.getElementById(
          "loginButton"
        );

      button.disabled = true;
      button.textContent =
        "جاري تسجيل الدخول...";


      try {

        const {
          data,
          error
        } =
          await sb.auth.signInWithPassword({
            email,
            password
          });


        if (error) {

          console.error(error);

          toast(
            "فشل تسجيل الدخول: " +
            error.message,
            "error"
          );

          return;
        }


        if (!data.session) {

          toast(
            "لم يتم إنشاء جلسة الدخول",
            "error"
          );

          return;
        }


        showApp();

        await loadData();

      }
      catch(error) {

        console.error(error);

        toast(
          "حدث خطأ أثناء تسجيل الدخول",
          "error"
        );

      }
      finally {

        button.disabled = false;

        button.textContent =
          "تسجيل الدخول";

      }

    });


  /* =========================
     SHOW APP
  ========================= */

  function showApp() {

    document.getElementById(
      "loginPage"
    ).style.display = "none";

    document.getElementById(
      "app"
    ).style.display = "block";

  }


  function showLogin() {

    document.getElementById(
      "loginPage"
    ).style.display = "flex";

    document.getElementById(
      "app"
    ).style.display = "none";

  }


  /* =========================
     LOGOUT
  ========================= */

  async function logout() {

    if (!sb) return;

    await sb.auth.signOut();

    products = [];
    orders = [];

    showLogin();

  }


  /* ===================
